<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trainable</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400..800;1,400..600&display=swap">
<style>
/* ==========================================================================
   Trainable — styles
   Same palette as Claude Power-Up: ink navy, ultramarine, highlighter yellow.
   ========================================================================== */

:root {
  color-scheme: light;
  --bg: #f3f4f8;
  --surface: #ffffff;
  --surface-2: #f0f1f7;
  --ink: #0f1330;
  --ink-2: #394063;
  --muted: #676d90;
  --line: #dfe2ec;
  --accent: #2e3bff;
  --accent-hover: #1f2be0;
  --accent-ink: #ffffff;
  --accent-soft: #e9ebff;
  --marker: #ffe45c;
  --marker-ink: #221e00;
  --good: #0b875e;
  --good-soft: #def4ea;
  --bad: #d42a43;
  --bad-soft: #fce6e9;
  --warn: #a86400;
  --warn-soft: #fff1d6;
  --shadow: 0 14px 34px -14px rgba(15, 19, 48, 0.28);
  --f: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0a0d1f;
    --surface: #121634;
    --surface-2: #181d42;
    --ink: #eef0ff;
    --ink-2: #c4c9e8;
    --muted: #8d93bd;
    --line: #262c58;
    --accent: #8a95ff;
    --accent-hover: #a3acff;
    --accent-ink: #0a0d1f;
    --accent-soft: #1d2466;
    --marker: #f2d84b;
    --marker-ink: #1c1800;
    --good: #3ad49b;
    --good-soft: #0f2e27;
    --bad: #ff7085;
    --bad-soft: #3a1522;
    --warn: #f5b947;
    --warn-soft: #362709;
    --shadow: 0 14px 34px -14px rgba(0, 0, 0, 0.7);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0d1f;
  --surface: #121634;
  --surface-2: #181d42;
  --ink: #eef0ff;
  --ink-2: #c4c9e8;
  --muted: #8d93bd;
  --line: #262c58;
  --accent: #8a95ff;
  --accent-hover: #a3acff;
  --accent-ink: #0a0d1f;
  --accent-soft: #1d2466;
  --marker: #f2d84b;
  --marker-ink: #1c1800;
  --good: #3ad49b;
  --good-soft: #0f2e27;
  --bad: #ff7085;
  --bad-soft: #3a1522;
  --warn: #f5b947;
  --warn-soft: #362709;
  --shadow: 0 14px 34px -14px rgba(0, 0, 0, 0.7);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html,
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button,
input,
textarea {
  font: inherit;
  color: inherit;
}

.tr-app {
  max-width: 760px;
  margin: 0 auto;
  padding: 16px 16px 64px;
  min-height: 100vh;
}

.tr-loading {
  text-align: center;
  color: var(--muted);
  padding: 80px 0;
}

/* ---------- Top bar ---------- */

.tr-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 4px 0 20px;
}

.tr-logo {
  font-weight: 800;
  font-size: 20px;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.tr-logo-mark {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--accent);
  color: var(--accent-ink);
  display: grid;
  place-items: center;
  font-size: 16px;
}

.tr-steps {
  display: flex;
  gap: 6px;
  font-size: 13px;
  color: var(--muted);
}

.tr-steps span {
  padding: 3px 10px;
  border-radius: 99px;
  background: var(--surface-2);
}

.tr-steps span.on {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 700;
}

.tr-steps span.done {
  background: var(--good-soft);
  color: var(--good);
}

/* ---------- Cards and text ---------- */

.tr-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 20px;
  margin-bottom: 16px;
}

.tr-hero h1 {
  font-size: clamp(32px, 7vw, 52px);
  line-height: 1.05;
  letter-spacing: -0.03em;
  margin: 8px 0 12px;
}

.tr-hero p.lead {
  font-size: 18px;
  color: var(--ink-2);
  margin: 0 0 20px;
}

h2 {
  font-size: 22px;
  letter-spacing: -0.01em;
  margin: 0 0 8px;
}

h3 {
  font-size: 17px;
  margin: 0 0 6px;
}

p {
  margin: 0 0 10px;
}

.muted {
  color: var(--muted);
}

.small {
  font-size: 14px;
}

.hl {
  background: var(--marker);
  color: var(--marker-ink);
  padding: 0 4px;
  border-radius: 4px;
}

.tag {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--accent-soft);
  color: var(--accent);
}

.tag.warn {
  background: var(--warn-soft);
  color: var(--warn);
}

.how {
  list-style: none;
  padding: 0;
  margin: 0 0 20px;
  display: grid;
  gap: 10px;
}

.how li {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.how b.n {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-size: 14px;
}

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  padding: 10px 16px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  min-height: 44px;
}

a.btn {
  color: var(--accent);
}

.btn:hover {
  border-color: var(--accent);
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

.btn.primary:hover {
  background: var(--accent-hover);
}

.btn.ghost {
  border-color: transparent;
  background: transparent;
  color: var(--muted);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 12px;
}

.choice-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  margin: 12px 0;
}

.choice {
  text-align: left;
  border: 2px solid var(--line);
  background: var(--surface);
  border-radius: var(--r);
  padding: 16px;
  cursor: pointer;
}

.choice:hover,
.choice.on {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.choice b {
  display: block;
  font-size: 18px;
  margin-bottom: 4px;
}

/* ---------- Chat ---------- */

.chat {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 16px;
}

.bubble {
  max-width: 88%;
  padding: 12px 16px;
  border-radius: 16px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.bubble.bot {
  align-self: flex-start;
  background: var(--surface);
  border: 1px solid var(--line);
  border-bottom-left-radius: 4px;
}

.bubble.me {
  align-self: flex-end;
  background: var(--accent);
  color: var(--accent-ink);
  border-bottom-right-radius: 4px;
}

.bubble.thinking {
  color: var(--muted);
  font-style: italic;
}

.composer {
  position: sticky;
  bottom: 0;
  background: var(--bg);
  padding: 8px 0 12px;
}

.composer-box {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

textarea.input,
input.input {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 12px;
  padding: 12px 14px;
  resize: vertical;
  min-height: 48px;
}

textarea.input:focus,
input.input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 0;
  border-color: transparent;
}

.progress-dots {
  display: flex;
  gap: 4px;
  margin: 6px 0 0;
}

.progress-dots i {
  width: 18px;
  height: 4px;
  border-radius: 2px;
  background: var(--line);
}

.progress-dots i.on {
  background: var(--accent);
}

/* ---------- Summary ---------- */

.facts {
  display: grid;
  gap: 12px;
  margin: 12px 0;
}

.fact label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 4px;
}

/* ---------- Activity ---------- */

.step {
  border-left: 4px solid var(--line);
  padding-left: 16px;
  margin: 0 0 20px;
}

.step.done {
  border-left-color: var(--good);
}

.prompt-box {
  background: var(--surface-2);
  border-radius: 10px;
  padding: 12px 14px;
  margin: 8px 0;
  white-space: pre-wrap;
  font-size: 15px;
}

.tip {
  background: var(--warn-soft);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 14px;
  margin: 8px 0;
}

.check {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  cursor: pointer;
  margin: 8px 0;
}

.check input {
  width: 20px;
  height: 20px;
  margin-top: 2px;
  accent-color: var(--good);
}

.quiz-q {
  margin-bottom: 18px;
}

.quiz-opt {
  display: block;
  width: 100%;
  text-align: left;
  margin: 6px 0;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
}

.quiz-opt.right {
  border-color: var(--good);
  background: var(--good-soft);
}

.quiz-opt.wrong {
  border-color: var(--bad);
  background: var(--bad-soft);
}

.feedback {
  font-size: 14px;
  padding: 6px 2px;
}

.ideas {
  margin: 0;
  padding-left: 20px;
}

.ideas li {
  margin-bottom: 6px;
}

.done-banner {
  text-align: center;
  padding: 28px 20px;
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: var(--r);
  margin-bottom: 16px;
}

.done-banner h2 {
  font-size: 28px;
}

.stars {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.stars button {
  min-width: 56px;
}

.stars button.on {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}

.notice {
  background: var(--warn-soft);
  color: var(--ink);
  border-radius: 10px;
  padding: 12px 14px;
  margin: 12px 0;
  font-size: 15px;
}

.error {
  background: var(--bad-soft);
  border-radius: 10px;
  padding: 12px 14px;
  margin: 12px 0;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 14px;
  box-shadow: var(--shadow);
  z-index: 10;
}

.foot {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  margin-top: 32px;
}

@media (max-width: 520px) {
  .tr-steps {
    display: none;
  }
  .bubble {
    max-width: 94%;
  }
}

</style>
<meta name="description" content="An AI coach interviews you about your work, then builds a hands-on activity that helps you use AI in your own workflow.">
</head>
<body>
<div id="app" class="tr-app">
  <p class="tr-loading">Loading Trainable…</p>
  <noscript><p class="tr-loading">Trainable needs JavaScript turned on.</p></noscript>
</div>
<script>
/* ==========================================================================
   Trainable — first version
   1. An AI coach interviews a person (or a team lead) about their work.
   2. It shows back what it learned, so they can fix it.
   3. It builds one hands-on activity around their real work.
   The AI parts use Claude through the artifact "sample" capability, so the
   page must be opened from its Claude link. Elsewhere it offers an example.
   ========================================================================== */
(function () {
  'use strict';

  var KEY = 'trainable:v1';
  var MAX_ANSWERS = 9;
  var TARGET_ANSWERS = 7;
  var app = document.getElementById('app');

  /* ---------- Small helpers ---------- */

  function h(tag, props) {
    var parts = tag.split(/(?=[.#])/);
    var el = document.createElement(parts[0] || 'div');
    parts.slice(1).forEach(function (p) {
      if (p[0] === '.') el.classList.add(p.slice(1));
      else el.id = p.slice(1);
    });
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v == null || v === false) return;
        if (k === 'on') Object.keys(v).forEach(function (e) { el.addEventListener(e, v[e]); });
        else if (k === 'text') el.textContent = v;
        else if (k in el && k !== 'list') el[k] = v;
        else el.setAttribute(k, v === true ? '' : v);
      });
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) c.forEach(function (x) { add(el, x); });
    else el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  function str(v, max) {
    var s = v == null ? '' : String(v).trim();
    return max && s.length > max ? s.slice(0, max) : s;
  }
  function arr(v) {
    return Array.isArray(v) ? v : [];
  }

  var toastTimer;
  function toast(msg) {
    var old = document.querySelector('.toast');
    if (old) old.remove();
    var t = h('div.toast', { role: 'status', text: msg });
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.remove(); }, 2200);
  }

  function copy(text) {
    var done = function () { toast('Copied. Paste it into Claude.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text);
      done();
    }
  }
  function fallbackCopy(text) {
    var ta = h('textarea', { value: text, style: 'position:fixed;opacity:0' });
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* ignore */ }
    ta.remove();
  }

  function claudeLink(prompt) {
    var q = encodeURIComponent(prompt || '');
    return q && q.length < 7000 ? 'https://claude.ai/new?q=' + q : 'https://claude.ai/new';
  }

  /* ---------- Saved state ---------- */

  function fresh() {
    return { screen: 'welcome', mode: 'me', turns: [], finished: false, profile: null, activity: null, demo: false, progress: {} };
  }
  var S = fresh();
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.screen) S = Object.assign(fresh(), saved);
  } catch (e) { /* no saved state */ }
  if (S.screen === 'building') S.screen = S.profile ? 'summary' : 'welcome';

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage off */ }
  }
  function go(screen) {
    S.screen = screen;
    save();
    render();
    window.scrollTo(0, 0);
  }

  /* ---------- Claude (only inside a Claude viewer that allows it) ---------- */

  var AI = { fn: null, status: 'pending' };
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('sample').then(
      function (fn) {
        AI.fn = typeof fn === 'function' ? fn : null;
        AI.status = AI.fn ? 'ready' : 'absent';
        if (S.screen === 'welcome' || S.screen === 'interview') render();
      },
      function () {
        AI.status = 'absent';
        if (S.screen === 'welcome') render();
      }
    );
  } else {
    AI.status = 'absent';
  }

  function errorText(e) {
    var code = e && e.code;
    if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared')
      return 'The coach needs your OK to use Claude. Reload the page and choose Allow.';
    if (code === 'rate_limited') return 'Claude is busy, or you’ve reached your usage limit. Wait a little, then try again.';
    if (code === 'session_expired') return 'Please sign in to Claude again, then try again.';
    if (code === 'invalid_json') return 'Claude’s answer came back jumbled. Please try again.';
    if (code === 'prompt_too_large') return 'That’s too much text in one go. Try shorter answers.';
    return 'Couldn’t reach Claude just now. Please try again.';
  }

  /* ---------- What we tell Claude ---------- */

  function interviewRules() {
    var who = S.mode === 'team'
      ? 'a team lead, about the team they run. Learn about the team as a whole: what the team does, the different roles in it, the work they repeat every week, the tools they share, where work gets stuck, and how comfortable the team is with AI.'
      : 'one person, about their own job. Learn: their role and what kind of company they work in, the main tasks in a normal week, the tools and apps they use, what feels slow, boring or repetitive, and how much they have used AI tools like Claude before.';
    return [
      'You are the friendly interview coach inside Trainable, an app that teaches people at work to use AI in their real day-to-day work.',
      'You are interviewing ' + who,
      'Your goal: learn enough to design ONE hands-on practice activity that uses their real work. Near the end, ask which one task they would most like AI to help with, and ask for a small real example of it (what goes in and what comes out).',
      '',
      'Rules:',
      '- Ask ONE question at a time. Keep each message under 40 words.',
      '- Use very simple, warm, everyday English. No jargon or technical words.',
      '- Start each message (except the first) with a short, specific reaction to what they said, then the next question.',
      '- If an answer is vague, ask a short follow-up to get a concrete example.',
      '- Do not give advice or tips yet. Just listen and ask.',
      '- Never ask for passwords, private customer data, or anything confidential. If they share some, tell them they don’t need to.',
      '- Ask between 5 and ' + (MAX_ANSWERS - 1) + ' questions in total. When you have enough, send a short thank-you that says you will now build their activity, and put the exact text <<DONE>> on its own line at the very end.',
      '',
      'Begin now with a one-line hello (you are their Trainable coach) and your first question.'
    ].join('\n');
  }

  function transcript() {
    return S.turns.slice(1).map(function (t) {
      return (t.role === 'assistant' ? 'Coach: ' : (S.mode === 'team' ? 'Team lead: ' : 'Person: ')) + t.content;
    }).join('\n\n');
  }

  function profilePrompt() {
    return [
      'Below is an interview between a training coach and ' + (S.mode === 'team' ? 'a team lead about their team' : 'a person about their job') + '.',
      'Pull out what we learned. Reply with only one JSON object with these keys, every value a short plain-English string (write "Not mentioned" if unknown):',
      '{"role": "their job or the team’s job, and the kind of company",',
      ' "tasks": "the main tasks in a normal week",',
      ' "tools": "the tools and apps they use",',
      ' "pains": "what feels slow, boring or repetitive",',
      ' "aiLevel": "how much they have used AI so far",',
      ' "focus": "the ONE real task the activity should be built around, with any example they gave"}',
      'Write in second person ("You…" or "Your team…"). Keep each value under 50 words.',
      '',
      'INTERVIEW:',
      transcript()
    ].join('\n');
  }

  function activityPrompt() {
    var p = S.profile || {};
    var team = S.mode === 'team';
    return [
      'You design short, hands-on AI practice activities for people at work. The learner is not technical.',
      team ? 'This activity is for a whole team. The team lead will run it with the team.' : 'This activity is for one person.',
      '',
      'WHAT WE KNOW:',
      'Role and company: ' + str(p.role),
      'Main tasks: ' + str(p.tasks),
      'Tools: ' + str(p.tools),
      'What slows them down: ' + str(p.pains),
      'AI experience: ' + str(p.aiLevel),
      'Task to build the activity around: ' + str(p.focus),
      '',
      'Design ONE activity that helps them use Claude for that real task. Rules:',
      '- Teach by doing. They will work in a normal Claude chat at claude.ai. No special setup, add-ons or coding.',
      '- 4 steps that build on each other: 1) a first simple try, 2) give Claude more background so the answer gets much better, 3) ask Claude to improve or check its work, 4) turn it into something reusable they can use every week (for example a saved prompt template, or a Claude Project with their instructions).',
      '- Each step has a ready-to-paste prompt. Put the parts they must fill in inside [square brackets], like [paste your notes here]. Prompts must fit their real work, not a made-up company.',
      '- Match their AI experience: simpler for beginners, more ambitious for regular users.',
      '- Very simple English, short sentences, no jargon. No time estimates. Don’t invent facts about their company.',
      '- Remind them not to paste passwords or private customer details.',
      '',
      'Reply with only one JSON object in exactly this shape:',
      '{"title": "short, catchy activity name",',
      ' "why": "1-2 sentences on why this helps them, using their words",',
      ' "skill": "the AI habit it teaches, in 2-5 words",',
      ' "steps": [{"title": "short step name", "do": "1-3 sentences: what to do and what to notice", "prompt": "the ready-to-paste prompt", "tip": "one short tip"}],',
      ' "quiz": [{"q": "question about using this skill in their work", "options": ["a", "b", "c"], "answer": 0, "why": "one sentence explaining the right answer"}],',
      ' "doneWhen": ["3 short checks that show they have done it well"],',
      team ? ' "teamNotes": "2-3 sentences on how the lead can run this with the team, for example who tries which step and how to share results",' : '',

        return { q: str(q && q.q, 400), options: options, answer: answer >= 0 && answer < options.length ? answer : 0, why: str(q && q.why, 400) };
      }).filter(function (q) { return q.q && q.options.length > 1; }),

  /* ---------- 2. Interview ---------- */

    if (!AI.fn || busy) return;

    var bubble = null;
    render();
    var input = S.turns.slice();
    if (answers() >= MAX_ANSWERS) {
      input.push({ role: 'user', content: '(Coach: that was the last question. Thank them in one line, say you will now build their activity, and end with <<DONE>>.)' });

    AI.fn(input, {
      cache: false,

      onText: function (u) {

  function activityText() {
    var a = S.activity, P = prog(), L = [];
    L.push('# ' + a.title, '');

    if (a.teamNotes) L.push('Running it with your team: ' + a.teamNotes, '');
    a.steps.forEach(function (s, i) {
      L.push('## Step ' + (i + 1) + ': ' + s.title, '');

      if (s.prompt) L.push('Prompt:', '', s.prompt.split('\n').map(function (l) { return '> ' + l; }).join('\n'), '');
      if (s.tip) L.push('Tip: ' + s.tip, '');

    if (a.doneWhen.length) L.push('## You’ve nailed it when', '', a.doneWhen.map(function (d) { return '- ' + d; }).join('\n'), '');

    if (P.reflection) L.push('## My notes', '', P.reflection, '');

  function downloadActivity() {
    var text = activityText();
    var name = (S.activity.title || 'activity').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) + '.md';
    var viaBlob = function () {
      try {
        var url = URL.createObjectURL(new Blob([text], { type: 'text/markdown;charset=utf-8' }));
        var link = h('a', { href: url, download: name, style: 'display:none' });
        document.body.appendChild(link);
        link.click();
        setTimeout(function () { URL.revokeObjectURL(url); link.remove(); }, 800);
      } catch (e) {
        copy(text);
      }
    };
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(function (d) {
        if (!d) { copy(text); toast('Saving isn’t available here, so it was copied instead.'); return; }
        d.save({ filename: name, data: text }).catch(function () { /* declined */ });
      }, function () { copy(text); });
    } else viaBlob();
  }
